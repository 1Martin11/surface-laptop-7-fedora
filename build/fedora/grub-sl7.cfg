# SL7-Projekt: GRUB-Menue des Fedora-KDE-Live-ISO fuer den Surface Laptop 7 (X1E80100, Romulus13/15).
# Basis: Fedoras kiwi-grub.cfg (search --file /boot/0x3d6eb6b1, Label Fedora-KDE-Live-44).
# Kernel: linux-sl7b / linux-sl7a = dtbloader-Images (stubble: DTB automatisch per HWID),
#         vmlinuz-sl7b / vmlinuz-sl7a = normale Kernel fuer Eintraege mit explizitem "devicetree".

set default="0"

function load_video {
	insmod efi_gop
	insmod efi_uga
	insmod video_bochs
	insmod video_cirrus
	insmod all_video
}
set basicgfx="nomodeset"

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2
insmod fdt

# Tastatur im GRUB: auf dem SL7 laut Launchpad #2084951 nur mit gfxterm zuverlaessig; console bleibt als zweite Ausgabe (QEMU/seriell).
if loadfont ($root)/boot/aarch64/loader/grub2/fonts/unicode.pf2; then
	set gfxmode=auto
	insmod gfxterm
	terminal_output gfxterm console
else
	terminal_output console
fi
terminal_input console

set timeout=20
set timeout_style=menu

search --file --set=root /boot/0x3d6eb6b1

set LIVE="root=live:CDLABEL=Fedora-KDE-Live-44 rd.live.image"
set X1E="clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0"
set NOADSP="modprobe.blacklist=qcom_q6v5_pas"
set DIAG="plymouth.enable=0 loglevel=7 systemd.show_status=1 console=tty0 rd.timeout=180"
set L=/boot/aarch64/loader
set D=/boot/dtb

menuentry "SL7: Fedora KDE Live - Kernel B 7.3 (ItsLucas)  [Standard, USB-C-sicher: ohne ADSP/Audio]" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)$L/linux-sl7b quiet rhgb $LIVE $X1E $NOADSP
	initrd ($root)$L/initrd-sl7b
}
menuentry "SL7: Kernel B 7.3 - mit ADSP/Audio  (USB-A-Stick oder interne SSD)" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)$L/linux-sl7b quiet rhgb $LIVE $X1E
	initrd ($root)$L/initrd-sl7b
}
menuentry "SL7: Kernel A 7.0 (ELLX-Basis, konservativ)  [USB-C-sicher]" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)$L/linux-sl7a quiet rhgb $LIVE $X1E $NOADSP
	initrd ($root)$L/initrd-sl7a
}
menuentry "SL7: Kernel A 7.0 - mit ADSP/Audio" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)$L/linux-sl7a quiet rhgb $LIVE $X1E
	initrd ($root)$L/initrd-sl7a
}
submenu "Touchscreen-Varianten (Geraetebaum per devicetree) -->" {
	menuentry "Kernel B - Touchscreen als I2C (fQwQf-Variante), USB-C-sicher" {
		devicetree ($root)$D/sl7b/x1e80100-microsoft-romulus13-i2cts.dtb
		linux ($root)$L/vmlinuz-sl7b quiet rhgb $LIVE $X1E $NOADSP
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Kernel B - Touchscreen als I2C (fQwQf-Variante), mit ADSP/Audio" {
		devicetree ($root)$D/sl7b/x1e80100-microsoft-romulus13-i2cts.dtb
		linux ($root)$L/vmlinuz-sl7b quiet rhgb $LIVE $X1E
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Kernel A - experimentell (SPI-Touchscreen, iris-Video, Thermal-Trips), USB-C-sicher" {
		devicetree ($root)$D/sl7a/x1e80100-microsoft-romulus13-exp.dtb
		linux ($root)$L/vmlinuz-sl7a quiet rhgb $LIVE $X1E $NOADSP
		initrd ($root)$L/initrd-sl7a
	}
	menuentry "Kernel A - Touchscreen als I2C (fQwQf-Variante), USB-C-sicher" {
		devicetree ($root)$D/sl7a/x1e80100-microsoft-romulus13-i2cts.dtb
		linux ($root)$L/vmlinuz-sl7a quiet rhgb $LIVE $X1E $NOADSP
		initrd ($root)$L/initrd-sl7a
	}
	menuentry "Kernel A - Standard-DTB explizit (13,8 Zoll), USB-C-sicher" {
		devicetree ($root)$D/sl7a/x1e80100-microsoft-romulus13.dtb
		linux ($root)$L/vmlinuz-sl7a quiet rhgb $LIVE $X1E $NOADSP
		initrd ($root)$L/initrd-sl7a
	}
}
submenu "Diagnose / Problembehebung -->" {
	menuentry "Kernel B - Diagnose (kein Splash, ausfuehrliche Meldungen), USB-C-sicher" {
		linux ($root)$L/linux-sl7b $LIVE $X1E $NOADSP $DIAG
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Kernel A - Diagnose (kein Splash, ausfuehrliche Meldungen), USB-C-sicher" {
		linux ($root)$L/linux-sl7a $LIVE $X1E $NOADSP $DIAG
		initrd ($root)$L/initrd-sl7a
	}
	menuentry "Kernel B - Diagnose extrem (initcall_debug, langsame Ausgabe, kein Reboot bei Panic)" {
		linux ($root)$L/linux-sl7b $LIVE $X1E $NOADSP $DIAG initcall_debug rd.shell panic=0 boot_delay=20
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Kernel B - mit arm64.nopauth (Ubuntu-x1e-Variante)" {
		linux ($root)$L/linux-sl7b quiet rhgb $LIVE $X1E arm64.nopauth $NOADSP
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Kernel B - ohne clk/pd_ignore_unused (Launchpad-Rat bei Boot-Schleife)" {
		linux ($root)$L/linux-sl7b $LIVE systemd.tpm2_wait=0 $NOADSP $DIAG
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Kernel B - 64-GB-Modell (GRUB cutmem 0x8800000000-0x8fffffffff)" {
		cutmem 0x8800000000 0x8fffffffff
		linux ($root)$L/linux-sl7b quiet rhgb $LIVE $X1E $NOADSP
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Kernel B - einfacher Grafikmodus (nomodeset)" {
		linux ($root)$L/linux-sl7b quiet rhgb $LIVE $X1E $NOADSP ${basicgfx}
		initrd ($root)$L/initrd-sl7b
	}
	menuentry "Fedora-Original: Stock-Kernel 6.19.10 (unveraendert, ohne SL7-Anpassungen)" {
		linux ($root)$L/linux quiet rhgb $LIVE
		initrd ($root)$L/initrd
	}
	menuentry "Fedora-Original mit X1E-Parametern (Fedora-Wiki: clk/pd_ignore_unused, tpm2_wait, ADSP aus)" {
		linux ($root)$L/linux quiet rhgb $LIVE $X1E $NOADSP
		initrd ($root)$L/initrd
	}
	menuentry "Fedora-Original: Medium pruefen und starten" {
		linux ($root)$L/linux quiet rhgb $LIVE rd.live.check
		initrd ($root)$L/initrd
	}
	menuentry "QEMU-Test: Kernel B mit serieller Konsole (nur fuer Emulator)" {
		linux ($root)$L/linux-sl7b $LIVE console=ttyAMA0 systemd.show_status=1
		initrd ($root)$L/initrd-sl7b
	}
}
