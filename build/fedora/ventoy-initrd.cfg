# Nur fuer Ventoy (wird vom normalen Bootweg nie gelesen): Ventoy 1.1.x sammelt initrd-Pfade aus /boot/grub/grub.cfg
# und verwirft Pfade mit $-Variablen. Ohne diese Liste findet das Live-System unter Ventoy sein Medium nicht.
initrd /boot/aarch64/loader/initrd-sl7b
initrd /boot/aarch64/loader/initrd-sl7a
initrd /boot/aarch64/loader/initrd
